openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BenchBoard consultant availability and matching API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: consultants
    description: Consultant roster operations
  - name: dashboard
    description: Dashboard summary operations
  - name: matching
    description: AI-assisted consultant matching
  - name: clients
    description: Client portal operations
  - name: projects
    description: Client project operations
  - name: auth
    description: Signed-in workspace and demo account operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentProfile
      tags: [auth]
      summary: Get the signed-in user's workspace profile
      responses:
        "200":
          description: Current workspace profile, or an empty profile before onboarding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentProfile"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/role:
    post:
      operationId: createCurrentProfile
      tags: [auth]
      summary: Create the signed-in user's consultant or client profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSetupInput"
      responses:
        "201":
          description: Created workspace profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentProfile"
        "400":
          description: Invalid setup details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /demo-accounts:
    get:
      operationId: listDemoAccounts
      tags: [auth]
      summary: Ensure development demo accounts exist
      responses:
        "200":
          description: Demo account credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoAccounts"
  /consultants:
    get:
      operationId: listConsultants
      tags: [consultants]
      summary: List consultants
      description: Returns the consultant roster with active engagement details.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AvailabilityStatus"
      responses:
        "200":
          description: Consultant roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Consultant"
    post:
      operationId: createConsultant
      tags: [consultants]
      summary: Add a consultant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultantInput"
      responses:
        "201":
          description: Created consultant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultant"
        "400":
          description: Invalid consultant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /consultants/{id}:
    patch:
      operationId: updateConsultant
      tags: [consultants]
      summary: Update a consultant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultantUpdate"
      responses:
        "200":
          description: Updated consultant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultant"
        "404":
          description: Consultant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteConsultant
      tags: [consultants]
      summary: Remove a consultant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Consultant removed
        "404":
          description: Consultant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients
      description: Returns client profiles ordered by rating.
      responses:
        "200":
          description: Client profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Invalid client details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List client projects
      parameters:
        - name: clientId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a client project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{id}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a client project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{id}/hire:
    post:
      operationId: hireConsultant
      tags: [projects]
      summary: Hire a consultant for a client project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HireInput"
      responses:
        "201":
          description: Created engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HireResponse"
        "400":
          description: Invalid hire request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or consultant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a client project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Project removed
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get availability summary
      description: Returns roster counts and near-term engagement alerts.
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /matching:
    post:
      operationId: matchConsultants
      tags: [matching]
      summary: Match consultants to a job description
      description: Extracts requirements, ranks roster matches, and explains each recommendation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchInput"
      responses:
        "200":
          description: Ranked consultant matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        "400":
          description: Invalid job description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Matching is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    CurrentProfile:
      type: object
      properties:
        role:
          type: ["string", "null"]
          enum: [consultant, client, null]
        profile:
          oneOf:
            - $ref: "#/components/schemas/Consultant"
            - $ref: "#/components/schemas/Client"
            - type: "null"
      required: [role, profile]
    ProfileSetupInput:
      type: object
      properties:
        role:
          type: string
          enum: [consultant, client]
        name:
          type: string
          minLength: 1
        title:
          type: string
        hourlyRate:
          type: number
          minimum: 0
        company:
          type: string
        industry:
          type: string
        bio:
          type: string
      required: [role, name]
    DemoAccount:
      type: object
      properties:
        role:
          type: string
          enum: [consultant, client]
        email:
          type: string
          format: email
        password:
          type: string
      required: [role, email, password]
    DemoAccounts:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/DemoAccount"
      required: [accounts]
    HireInput:
      type: object
      properties:
        consultantId:
          type: integer
          minimum: 1
      required: [consultantId]
    HireResponse:
      type: object
      properties:
        message:
          type: string
        engagement:
          type: object
          additionalProperties: true
      required: [message, engagement]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AvailabilityStatus:
      type: string
      enum: [available, deployed, unavailable]
    Engagement:
      type: object
      properties:
        id:
          type: integer
        projectName:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required: [id, projectName, startDate, endDate]
    Consultant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        title:
          type: string
        skills:
          type: array
          items:
            type: string
        serviceOffers:
          type: array
          items:
            type: string
        hourlyRate:
          type: number
        availabilityStatus:
          $ref: "#/components/schemas/AvailabilityStatus"
        engagement:
          type: ["object", "null"]
          $ref: "#/components/schemas/Engagement"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, title, skills, serviceOffers, hourlyRate, availabilityStatus, engagement, createdAt, updatedAt]
    ConsultantInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        skills:
          type: array
          minItems: 1
          items:
            type: string
        serviceOffers:
          type: array
          items:
            type: string
        hourlyRate:
          type: number
          minimum: 0
        availabilityStatus:
          $ref: "#/components/schemas/AvailabilityStatus"
        projectName:
          type: ["string", "null"]
        engagementStartDate:
          type: ["string", "null"]
          format: date
        engagementEndDate:
          type: ["string", "null"]
          format: date
      required: [name, title, skills, hourlyRate, availabilityStatus]
    ConsultantUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        skills:
          type: array
          minItems: 1
          items:
            type: string
        serviceOffers:
          type: array
          items:
            type: string
        hourlyRate:
          type: number
          minimum: 0
        availabilityStatus:
          $ref: "#/components/schemas/AvailabilityStatus"
        projectName:
          type: ["string", "null"]
        engagementStartDate:
          type: ["string", "null"]
          format: date
        engagementEndDate:
          type: ["string", "null"]
          format: date
    Client:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        company:
          type: string
        industry:
          type: string
        bio:
          type: string
        rating:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, company, industry, bio, rating, createdAt, updatedAt]
    ClientInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        company:
          type: string
          minLength: 1
        industry:
          type: string
          minLength: 1
        bio:
          type: string
      required: [name, company, industry]
    ClientUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        company:
          type: string
          minLength: 1
        industry:
          type: string
          minLength: 1
        bio:
          type: string
    ProjectStatus:
      type: string
      enum: [planning, active, paused, completed]
    Project:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        name:
          type: string
        description:
          type: string
        skills:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
        budget:
          type: ["number", "null"]
        startDate:
          type: ["string", "null"]
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, clientId, name, description, skills, status, budget, startDate, endDate, createdAt, updatedAt]
    ProjectInput:
      type: object
      properties:
        clientId:
          type: integer
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 20
        skills:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
        budget:
          type: ["number", "null"]
        startDate:
          type: ["string", "null"]
          format: date
        endDate:
          type: ["string", "null"]
          format: date
      required: [clientId, name, description, skills, status]
    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 20
        skills:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
        budget:
          type: ["number", "null"]
        startDate:
          type: ["string", "null"]
          format: date
        endDate:
          type: ["string", "null"]
          format: date
    DashboardSummary:
      type: object
      properties:
        totalConsultants:
          type: integer
        available:
          type: integer
        deployed:
          type: integer
        unavailable:
          type: integer
        endingSoon:
          type: integer
      required: [totalConsultants, available, deployed, unavailable, endingSoon]
    MatchInput:
      type: object
      properties:
        jobDescription:
          type: string
          minLength: 20
      required: [jobDescription]
    MatchRequirements:
      type: object
      properties:
        skills:
          type: array
          items:
            type: string
        seniority:
          type: ["string", "null"]
        domain:
          type: ["string", "null"]
      required: [skills, seniority, domain]
    ConsultantMatch:
      type: object
      properties:
        rank:
          type: integer
        consultant:
          $ref: "#/components/schemas/Consultant"
        matchingSkills:
          type: array
          items:
            type: string
        reason:
          type: string
        score:
          type: number
      required: [rank, consultant, matchingSkills, reason, score]
    MatchResponse:
      type: object
      properties:
        requirements:
          $ref: "#/components/schemas/MatchRequirements"
        matches:
          type: array
          items:
            $ref: "#/components/schemas/ConsultantMatch"
      required: [requirements, matches]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

