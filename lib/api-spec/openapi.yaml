openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BenchBoard consultant availability and matching API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: consultants
    description: Consultant roster operations
  - name: dashboard
    description: Dashboard summary operations
  - name: matching
    description: AI-assisted consultant matching
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /consultants:
    get:
      operationId: listConsultants
      tags: [consultants]
      summary: List consultants
      description: Returns the consultant roster with active engagement details.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AvailabilityStatus"
      responses:
        "200":
          description: Consultant roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Consultant"
    post:
      operationId: createConsultant
      tags: [consultants]
      summary: Add a consultant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultantInput"
      responses:
        "201":
          description: Created consultant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultant"
        "400":
          description: Invalid consultant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /consultants/{id}:
    patch:
      operationId: updateConsultant
      tags: [consultants]
      summary: Update a consultant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultantUpdate"
      responses:
        "200":
          description: Updated consultant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultant"
        "404":
          description: Consultant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteConsultant
      tags: [consultants]
      summary: Remove a consultant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Consultant removed
        "404":
          description: Consultant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get availability summary
      description: Returns roster counts and near-term engagement alerts.
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /matching:
    post:
      operationId: matchConsultants
      tags: [matching]
      summary: Match consultants to a job description
      description: Extracts requirements, ranks roster matches, and explains each recommendation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchInput"
      responses:
        "200":
          description: Ranked consultant matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        "400":
          description: Invalid job description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Matching is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AvailabilityStatus:
      type: string
      enum: [available, deployed, unavailable]
    Engagement:
      type: object
      properties:
        id:
          type: integer
        projectName:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required: [id, projectName, startDate, endDate]
    Consultant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        title:
          type: string
        skills:
          type: array
          items:
            type: string
        hourlyRate:
          type: number
        availabilityStatus:
          $ref: "#/components/schemas/AvailabilityStatus"
        engagement:
          type: ["object", "null"]
          $ref: "#/components/schemas/Engagement"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - title
        - skills
        - hourlyRate
        - availabilityStatus
        - engagement
        - createdAt
        - updatedAt
    ConsultantInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        skills:
          type: array
          minItems: 1
          items:
            type: string
        hourlyRate:
          type: number
          minimum: 0
        availabilityStatus:
          $ref: "#/components/schemas/AvailabilityStatus"
        projectName:
          type: ["string", "null"]
        engagementStartDate:
          type: ["string", "null"]
          format: date
        engagementEndDate:
          type: ["string", "null"]
          format: date
      required: [name, title, skills, hourlyRate, availabilityStatus]
    ConsultantUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        skills:
          type: array
          minItems: 1
          items:
            type: string
        hourlyRate:
          type: number
          minimum: 0
        availabilityStatus:
          $ref: "#/components/schemas/AvailabilityStatus"
        projectName:
          type: ["string", "null"]
        engagementStartDate:
          type: ["string", "null"]
          format: date
        engagementEndDate:
          type: ["string", "null"]
          format: date
    DashboardSummary:
      type: object
      properties:
        totalConsultants:
          type: integer
        available:
          type: integer
        deployed:
          type: integer
        unavailable:
          type: integer
        endingSoon:
          type: integer
      required: [totalConsultants, available, deployed, unavailable, endingSoon]
    MatchInput:
      type: object
      properties:
        jobDescription:
          type: string
          minLength: 20
      required: [jobDescription]
    MatchRequirements:
      type: object
      properties:
        skills:
          type: array
          items:
            type: string
        seniority:
          type: ["string", "null"]
        domain:
          type: ["string", "null"]
      required: [skills, seniority, domain]
    ConsultantMatch:
      type: object
      properties:
        rank:
          type: integer
        consultant:
          $ref: "#/components/schemas/Consultant"
        matchingSkills:
          type: array
          items:
            type: string
        reason:
          type: string
        score:
          type: number
      required: [rank, consultant, matchingSkills, reason, score]
    MatchResponse:
      type: object
      properties:
        requirements:
          $ref: "#/components/schemas/MatchRequirements"
        matches:
          type: array
          items:
            $ref: "#/components/schemas/ConsultantMatch"
      required: [requirements, matches]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

