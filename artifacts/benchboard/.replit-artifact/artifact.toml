kind = "web"
previewPath = "/"
title = "BenchBoard"
description = "A focused availability and AI-assisted consultant matching tool for small consulting and staffing firms."
version = "1.0.0"
id = "artifacts/benchboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20293

[services.development]
run = "pnpm --filter @workspace/benchboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/benchboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/benchboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20293"
BASE_PATH = "/"
